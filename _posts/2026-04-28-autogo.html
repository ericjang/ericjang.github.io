// Three-part schedule. Windows are [start, end] in seconds. Each row gets a
// Sprite that renders exactly in its window; the SectionTicker picks the

  { part: 3, slug: 'mcts',              label: 'intro',              window: [ 97.5, 102.0], scene: () => <P2_Title /> },

  { part: 3, slug: 'alternate-rl',       label: '— alternate RL techniques',     window: [184.0, 187.5], scene: () => <Act3_AlternateRLTitle /> },

  { part: 4, slug: 'findings',            label: 'intro',                       window: [214.5, 221.5], scene: () => <P4_FindingsTitle /> },
  { part: 4, slug: 'winrate-vs-katago',    label: '14 · win rate vs katago',      window: [221.5, 231.5], scene: () => <P4_WinRateVsKataGo /> },
  { part: 4, slug: 'research-init',        label: '15 · research initialization', window: [231.5, 241.5], scene: () => <P4_ResearchInit /> },
  { part: 4, slug: 'experiment-timeline',  label: '16 · experiment log',          window: [241.5, 255.5], scene: () => <P4_ExperimentTimeline /> },
  { part: 4, slug: 'experiment-tree',      label: '17 · experiment tree',         window: [255.5, 265.5], scene: () => <P4_ExperimentTree /> },
  { part: 4, slug: 'autoresearch-llms',    label: '18 · autoresearch with llms',  window: [265.5, 275.5], scene: () => <P4_LLMAutoresearch /> },
  { part: 4, slug: 'variable-board',       label: '19 · variable board sizing',   window: [275.5, 285.5], scene: () => <P4_VariableBoard /> },
  { part: 4, slug: 'why-go',               label: '20 · why go for autoresearch', window: [285.5, 295.5], scene: () => <P4_WhyGo /> },
  { part: 4, slug: 'outro',                label: '— outro',                       window: [295.5, 303.5], scene: () => <AutoGo_Outro /> },
];

const PART_TITLES = {
  1: 'AutoGo',
  2: 'Part 1 · Rules of Go',
  3: 'Part 2 · MCTS',
  4: 'Part 3 · Research Findings',
};

const PART_LINK_LABELS = {
  1: 'AutoGo',
  2: 'Intro to Go',
  3: 'AlphaGo Tutorial',
  4: 'Research Findings',
};

const TOTAL = SCHEDULE[SCHEDULE.length - 1].window[1];

function Infographic() {
  return (
    <>
      {SCHEDULE.map((s, i) => (
        <Sprite key={i} start={s.window[0]} end={s.window[1]}>
          {/* Each slide gets a labelled landmark so screen readers can
              announce which slide is currently visible. */}
          <section
            aria-label={`${PART_TITLES[s.part]} — ${s.label.replace(/^[—\s]*/, '')}`}
            style={{ position: 'absolute', inset: 0 }}
          >
            {s.scene()}
          </section>
        </Sprite>
      ))}
      <SectionSidebar />
      <Watermark />
    </>
  );
}

// Left-sidebar outline. Each part renders as a heading; the active part
// auto-expands with its slide list underneath. Clicking any row seeks the
// timeline via setTime().
function SectionSidebar() {
  const t = useTime();
  const { setTime, setPlaying } = useTimeline();
  const current = SCHEDULE.find(s => t >= s.window[0] && t <= s.window[1]) || SCHEDULE[0];
  const currentPart = current.part;

  const seek = (to) => {
    setTime(Math.min(TOTAL - 0.01, to + 0.01));
    setPlaying(true);
  };
  const PARTS = [1, 2, 3, 4];

  return (
    <nav aria-label="Tutorial sections" style={{
      position: 'absolute', left: 12, top: 32, bottom: 32, width: 148,
      display: 'flex', flexDirection: 'column', gap: 14,
      fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--ink-soft)',
    }}>
      {PARTS.map(p => {
        const first = SCHEDULE.find(s => s.part === p);
        const start = first ? first.window[0] : 0;
        const isActivePart = p === currentPart;
        const partSlides = SCHEDULE.filter(s => s.part === p);

        return (
          <div key={p}>
            <SidebarPart
              label={PART_LINK_LABELS[p]}
              active={isActivePart}
              onClick={() => seek(start)}
              title={`Jump to ${PART_TITLES[p]}`}
            />

            {isActivePart && (
              <div style={{ marginTop: 4 }}>
                {partSlides.map((s, i) => {
                  const [sStart, sEnd] = s.window;
                  const slideActive = t >= sStart && t <= sEnd;
                  const done = t > sEnd;
                  return (
                    <SidebarSlide
                      key={i}
                      label={s.label}
                      active={slideActive}
                      done={done}
                      onClick={() => seek(sStart)}
                      title={`Jump to ${s.label}`}
                    />
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </nav>
  );
}

function SidebarPart({ label, active, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button
      type="button"
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      title={title}
      style={{
        display: 'block', width: '100%',
        padding: '4px 8px',
        textAlign: 'left',
        fontFamily: 'inherit',
        fontSize: 12,
        fontWeight: active ? 600 : 500,
        letterSpacing: '0.06em',
        textTransform: 'uppercase',
        border: 'none',
        background: hover && !active ? 'rgba(31,26,20,0.06)' : 'transparent',
        color: active ? 'var(--ink)' : 'var(--ink)',
        opacity: active ? 1 : 0.78,
        borderLeft: active ? '2px solid var(--ink)' : '2px solid transparent',
        cursor: 'pointer',
        transition: 'all 140ms',
      }}
    >
      {label}
    </button>
  );
}

function SidebarSlide({ label, active, done, onClick, title }) {
  const [hover, setHover] = React.useState(false);

  let bg = 'transparent';
  let color = 'var(--ink)';
  let opacity = done ? 0.7 : 0.92;
  if (active) {
    bg = 'var(--ink)';
    color = 'var(--bg)';
    opacity = 1;
  } else if (hover) {
    bg = 'rgba(31,26,20,0.07)';
    opacity = 1;
  }

  return (
    <button
      type="button"
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      title={title}
      style={{
        display: 'block', width: '100%',
        padding: '3px 8px 3px 16px',
        textAlign: 'left',
        fontFamily: 'inherit',
        fontSize: 11.5,
        border: 'none',
        background: bg,
        color, opacity,
        borderRadius: 3,
        cursor: 'pointer',
        whiteSpace: 'nowrap',
        overflow: 'hidden',
        textOverflow: 'ellipsis',
        transition: 'all 140ms',
      }}
    >
      {label}
    </button>
  );
}

function Watermark() {
  return (
    <div style={{
      position:'absolute', right:80, bottom:36,
      fontFamily:'var(--mono)', fontSize:12,
      color:'var(--ink-soft)',
      letterSpacing:'0.1em', textTransform:'uppercase',
    }}>
      AutoGo · notes
    </div>
  );
}

function App() {
  const slideStarts = React.useMemo(
    () => SCHEDULE.map(s => s.window[0]),
    []
  );

  // Resolve the initial playhead from the URL hash (so links like
  // .../autogo.html#capture jump straight to a slide). Without a hash, a
  // fresh page load starts at the beginning — reloading returns to the top.
  const initialTime = React.useMemo(() => {
    const hash = (typeof window !== 'undefined' ? window.location.hash : '').replace(/^#/, '');
    if (hash) {
      const entry = SCHEDULE.find(s => s.slug === hash);
      if (entry) return entry.window[0] + 0.01;
    }
    return 0;
  }, []);

  return (
    <>
      <Stage
        width={1280} height={720}
        duration={TOTAL}
        background="var(--bg)"
        loop={false}
        autoplay={true}
        scrollDriven
        keyframes={slideStarts}
        initialTime={initialTime}
        persistKey="autogo-tutorial"
      >
        <Infographic />
        <HashSync />
      </Stage>
    </>
  );
}

// Keeps the URL hash in sync with the current slide, and seeks the timeline
// when the hash changes externally (back/forward navigation, URL edits,
// anchor clicks from elsewhere on the page).
function HashSync() {
  const t = useTime();
  const { setTime, setPlaying } = useTimeline();

  // Apply the URL hash on mount so that opening the page at e.g.
  // /autogo.html#research-init lands on that slide instead of slide 0.
  // Layout effect (synchronous, pre-paint) so the seek wins the race
  // against the RAF loop's first tick.
  const initialAppliedRef = React.useRef(false);
  React.useLayoutEffect(() => {
    if (initialAppliedRef.current) return;
    initialAppliedRef.current = true;
    const h = window.location.hash.replace(/^#/, '');
    if (!h) return;
    const entry = SCHEDULE.find(s => s.slug === h);
    if (entry) {
      setTime(entry.window[0] + 0.01);
      setPlaying(true);
    }
  }, [setTime, setPlaying]);

  React.useEffect(() => {
    if (!initialAppliedRef.current) return; // skip until initial hash applied
    const cur = SCHEDULE.find(s => t >= s.window[0] && t <= s.window[1]);
    if (!cur || !cur.slug) return;
    const desired = '#' + cur.slug;
    if (window.location.hash !== desired) {
      history.replaceState(null, '', desired);
    }
  }, [t]);

  React.useEffect(() => {
    const onHash = () => {
      const h = window.location.hash.replace(/^#/, '');
      const entry = SCHEDULE.find(s => s.slug === h);
      if (entry) {
        setTime(entry.window[0] + 0.01);
        setPlaying(true);
      }
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, [setTime, setPlaying]);

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
