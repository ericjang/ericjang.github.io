// Three-part schedule. Windows are [start, end] in seconds. Each row gets a
// Sprite that renders exactly in its window; the SectionTicker picks the
// current part and renders that part's TOC at the bottom.
const SCHEDULE = [
  // Part 1 — AutoGo (cover + navigation + motivation + thanks)
  { part: 1, slug: 'cover',             label: '— cover',            window: [ 0.0,  5.0], scene: () => <TutorialCover /> },
  { part: 1, slug: 'how-to-navigate',   label: '— how to navigate',  window: [ 5.0, 12.0], scene: () => <IntroInstructions /> },
  { part: 1, slug: 'compute',           label: '01 · compute',       window: [12.0, 22.0], scene: () => <P4_Compute /> },
  { part: 1, slug: 'thanks',            label: '02 · thanks',        window: [22.0, 28.0], scene: () => <AutoGo_Thanks /> },

  // Part 2 — Rules of Go (mechanics → game flow → strategy)
  { part: 2, slug: 'rules-of-go',       label: 'intro',              window: [28.0, 32.0], scene: () => <P1_Title /> },
  { part: 2, slug: 'placing-stones',    label: '01 · placing stones',window: [32.0, 40.0], scene: () => <P1_PlacingStones /> },
  { part: 2, slug: 'capture',           label: '02 · capture',       window: [40.0, 48.0], scene: () => <P1_Capture /> },
  { part: 2, slug: 'ko',                label: '03 · ko',            window: [48.0, 55.0], scene: () => <P1_Ko /> },
  { part: 2, slug: 'end-of-game',       label: '04 · end of game',   window: [55.0, 62.0], scene: () => <P1_EndOfGame /> },
  { part: 2, slug: 'scoring',           label: '05 · scoring',       window: [62.0, 71.0], scene: () => <P1_Scoring /> },
  { part: 2, slug: 'basic-strategies',  label: '— basic strategies', window: [71.0, 74.0], scene: () => <P1_StrategiesTitle /> },
  { part: 2, slug: 'two-eyes',          label: '06 · two eyes',      window: [74.0, 82.0], scene: () => <P1_Eyes /> },
  { part: 2, slug: 'opening',           label: '07 · opening',       window: [82.0, 89.5], scene: () => <P1_Opening /> },
  { part: 2, slug: 'connect-and-cut',   label: '08 · connect & cut', window: [89.5, 97.5], scene: () => <P1_Connectivity /> },

  // Part 3 — MCTS
  { part: 3, slug: 'mcts',              label: 'intro',              window: [ 97.5, 102.0], scene: () => <P2_Title /> },
  { part: 3, slug: 'prior',             label: '01 · prior',         window: [102.0, 107.5], scene: () => <Act1_PriorFromNet /> },
  { part: 3, slug: 'why-search',        label: '02 · why search',    window: [107.5, 114.5], scene: () => <Act1b_WhySearch /> },
  { part: 3, slug: 'search',            label: '03 · mcts',          window: [114.5, 122.5], scene: () => <Act2_TreeSearch showPUCT={false} /> },
  { part: 3, slug: 'pseudocode',        label: '04 · pseudocode',    window: [122.5, 132.5], scene: () => <Act2b_Pseudocode /> },
  { part: 3, slug: 'target',            label: '05 · target',        window: [132.5, 138.5], scene: () => <Act3_NormalizeTarget /> },
  { part: 3, slug: 'not-imitation',     label: '06 · not imitation', window: [138.5, 147.5], scene: () => <Act3b_NotImitation /> },
  { part: 3, slug: 'train',             label: '07 · train',         window: [147.5, 156.5], scene: () => <Act4_NetworkChasesTarget /> },
  { part: 3, slug: 'loop',              label: '08 · loop',          window: [156.5, 164.5], scene: () => <Act5_MovingTarget /> },
  { part: 3, slug: 'perf',              label: '09 · perf',          window: [164.5, 176.0], scene: () => <Act6_Performance /> },
  { part: 3, slug: 'speedup',           label: '10 · speedup',       window: [176.0, 185.0], scene: () => <Act7_Speedup /> },

  // Part 4 — Research Findings
  { part: 4, slug: 'findings',          label: 'intro',              window: [185.0, 192.0], scene: () => <P4_FindingsTitle /> },
  { part: 4, slug: 'experiment-timeline', label: '11 · experiment log',      window: [192.0, 206.0], scene: () => <P4_ExperimentTimeline /> },
  { part: 4, slug: 'winrate-vs-katago', label: '12 · win rate vs katago', window: [206.0, 216.0], scene: () => <P4_WinRateVsKataGo /> },
  { part: 4, slug: 'variable-board',    label: '13 · variable board sizing', window: [216.0, 226.0], scene: () => <P4_VariableBoard /> },
];

const PART_TITLES = {
  1: 'AutoGo',
  2: 'Part 1 · Rules of Go',
  3: 'Part 2 · MCTS',
  4: 'Part 3 · Research Findings',
};

const PART_LINK_LABELS = {
  1: 'AutoGo',
  2: 'Intro to Go',
  3: 'AlphaGo Tutorial',
  4: 'Research Findings',
};

const TOTAL = SCHEDULE[SCHEDULE.length - 1].window[1];

function Infographic() {
  return (
    <>
      {SCHEDULE.map((s, i) => (
        <Sprite key={i} start={s.window[0]} end={s.window[1]}>
          {s.scene()}
        </Sprite>
      ))}
      <SectionSidebar />
      <Watermark />
    </>
  );
}

// Left-sidebar outline. Each part renders as a heading; the active part
// auto-expands with its slide list underneath. Clicking any row seeks the
// timeline via setTime().
function SectionSidebar() {
  const t = useTime();
  const { setTime } = useTimeline();
  const current = SCHEDULE.find(s => t >= s.window[0] && t <= s.window[1]) || SCHEDULE[0];
  const currentPart = current.part;

  const seek = (to) => setTime(Math.min(TOTAL - 0.01, to + 0.01));
  const PARTS = [1, 2, 3, 4];

  return (
    <div style={{
      position: 'absolute', left: 12, top: 32, bottom: 32, width: 148,
      display: 'flex', flexDirection: 'column', gap: 14,
      fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-soft)',
    }}>
      {PARTS.map(p => {
        const first = SCHEDULE.find(s => s.part === p);
        const start = first ? first.window[0] : 0;
        const isActivePart = p === currentPart;
        const partSlides = SCHEDULE.filter(s => s.part === p);

        return (
          <div key={p}>
            <SidebarPart
              label={PART_LINK_LABELS[p]}
              active={isActivePart}
              onClick={() => seek(start)}
              title={`Jump to ${PART_TITLES[p]}`}
            />

            {isActivePart && (
              <div style={{ marginTop: 4 }}>
                {partSlides.map((s, i) => {
                  const [sStart, sEnd] = s.window;
                  const slideActive = t >= sStart && t <= sEnd;
                  const done = t > sEnd;
                  return (
                    <SidebarSlide
                      key={i}
                      label={s.label}
                      active={slideActive}
                      done={done}
                      onClick={() => seek(sStart)}
                      title={`Jump to ${s.label}`}
                    />
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function SidebarPart({ label, active, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button
      type="button"
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      title={title}
      style={{
        display: 'block', width: '100%',
        padding: '4px 8px',
        textAlign: 'left',
        fontFamily: 'inherit',
        fontSize: 11,
        fontWeight: active ? 600 : 500,
        letterSpacing: '0.06em',
        textTransform: 'uppercase',
        border: 'none',
        background: hover && !active ? 'rgba(31,26,20,0.06)' : 'transparent',
        color: active ? 'var(--ink)' : 'var(--ink-soft)',
        opacity: active ? 1 : 0.55,
        borderLeft: active ? '2px solid var(--ink)' : '2px solid transparent',
        cursor: 'pointer',
        transition: 'all 140ms',
      }}
    >
      {label}
    </button>
  );
}

function SidebarSlide({ label, active, done, onClick, title }) {
  const [hover, setHover] = React.useState(false);

  let bg = 'transparent';
  let color = 'var(--ink)';
  let opacity = done ? 0.5 : 0.85;
  if (active) {
    bg = 'var(--ink)';
    color = 'var(--bg)';
    opacity = 1;
  } else if (hover) {
    bg = 'rgba(31,26,20,0.07)';
    opacity = 1;
  }

  return (
    <button
      type="button"
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      title={title}
      style={{
        display: 'block', width: '100%',
        padding: '3px 8px 3px 16px',
        textAlign: 'left',
        fontFamily: 'inherit',
        fontSize: 10.5,
        border: 'none',
        background: bg,
        color, opacity,
        borderRadius: 3,
        cursor: 'pointer',
        whiteSpace: 'nowrap',
        overflow: 'hidden',
        textOverflow: 'ellipsis',
        transition: 'all 140ms',
      }}
    >
      {label}
    </button>
  );
}

function Watermark() {
  return (
    <div style={{
      position:'absolute', right:80, bottom:36,
      fontFamily:'var(--mono)', fontSize:11,
      color:'var(--ink-soft)',
      letterSpacing:'0.1em', textTransform:'uppercase',
    }}>
      AutoGo · notes
    </div>
  );
}

function App() {
  const slideStarts = React.useMemo(
    () => SCHEDULE.map(s => s.window[0]),
    []
  );

  // Resolve the initial playhead from the URL hash (so links like
  // .../autogo.html#capture jump straight to a slide). Without a hash, a
  // fresh page load starts at the beginning — reloading returns to the top.
  const initialTime = React.useMemo(() => {
    const hash = (typeof window !== 'undefined' ? window.location.hash : '').replace(/^#/, '');
    if (hash) {
      const entry = SCHEDULE.find(s => s.slug === hash);
      if (entry) return entry.window[0] + 0.01;
    }
    return 0;
  }, []);

  return (
    <Stage
      width={1280} height={720}
      duration={TOTAL}
      background="var(--bg)"
      loop={false}
      autoplay={true}
      scrollDriven
      keyframes={slideStarts}
      initialTime={initialTime}
      persistKey="autogo-tutorial"
    >
      <Infographic />
      <HashSync />
    </Stage>
  );
}

// Keeps the URL hash in sync with the current slide, and seeks the timeline
// when the hash changes externally (back/forward navigation, URL edits,
// anchor clicks from elsewhere on the page).
function HashSync() {
  const t = useTime();
  const { setTime } = useTimeline();

  React.useEffect(() => {
    const cur = SCHEDULE.find(s => t >= s.window[0] && t <= s.window[1]);
    if (!cur || !cur.slug) return;
    const desired = '#' + cur.slug;
    if (window.location.hash !== desired) {
      history.replaceState(null, '', desired);
    }
  }, [t]);

  React.useEffect(() => {
    const onHash = () => {
      const h = window.location.hash.replace(/^#/, '');
      const entry = SCHEDULE.find(s => s.slug === h);
      if (entry) setTime(entry.window[0] + 0.01);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, [setTime]);

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
{% endraw %}
</script>
