<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel Collision Simulation</title>
    <style>
        body { font-family: Arial, sans-serif; }
        canvas { border: 1px solid #000; }
        .controls { margin-top: 10px; }
        input { width: 50px; }
        #collisionInfo { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="simulationCanvas" width="600" height="300"></canvas>
    <div class="controls">
        <label for="mass">Mass (kg): </label>
        <input type="number" id="mass" value="3" min="0.1" step="0.1">
        <label for="speed">Angular Speed (rad/s): </label>
        <input type="number" id="speed" value="5" min="0.1" step="0.1">
        <button id="startBtn">Start Simulation</button>
    </div>
    <div id="collisionInfo"></div>
    
    <script>
        (function() {
            const canvas = document.getElementById('simulationCanvas');
            const ctx = canvas.getContext('2d');
            const massInput = document.getElementById('mass');
            const speedInput = document.getElementById('speed');
            const startBtn = document.getElementById('startBtn');
            const collisionInfo = document.getElementById('collisionInfo');

            let wheelRadius = 40; // 0.4 meters * 100 pixels/meter
            let wheelX = canvas.width / 2;
            let wheelY = canvas.height / 2;
            let angle = -3 * Math.PI / 2; // Starting at -270 degrees
            let angularSpeed = 5;
            let mass = 3;
            let isSpinning = true;
            let animationId;

            function drawWheel() {
                ctx.beginPath();
                ctx.arc(wheelX, wheelY, wheelRadius, 0, Math.PI * 2);
                ctx.stroke();

                // Draw lever arm
                let leverLength = wheelRadius * 1.5;
                let leverEndX = wheelX + Math.cos(angle) * leverLength;
                let leverEndY = wheelY + Math.sin(angle) * leverLength;
                ctx.beginPath();
                ctx.moveTo(wheelX, wheelY);
                ctx.lineTo(leverEndX, leverEndY);
                ctx.stroke();
            }

            function drawBlock() {
                let blockWidth = 20;
                let blockHeight = 40;
                let blockX = wheelX + wheelRadius + 2; // 2 pixels gap
                let blockY = wheelY - blockHeight / 2;
                ctx.fillRect(blockX, blockY, blockWidth, blockHeight);
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                drawBlock();
                drawWheel();

                if (isSpinning) {
                    angle += angularSpeed * 0.016; // 0.016 is roughly 60 FPS
                    
                    // Check for collision
                    let leverLength = wheelRadius * 1.5;
                    let leverEndX = wheelX + Math.cos(angle) * leverLength;
                    let leverEndY = wheelY + Math.sin(angle) * leverLength;
                    
                    if (leverEndX >= wheelX + wheelRadius + 2 && // 2 pixels gap
                        leverEndY >= wheelY - 20 && leverEndY <= wheelY + 20) {
                        isSpinning = false;
                        let r = wheelRadius / 100
                        let kE = calculateKineticEnergy(mass, r, angularSpeed)
                        collisionInfo.textContent = `Collision! ${kE.toFixed(2)} joules`;
                    }
                }

                if (isSpinning) {
                    animationId = requestAnimationFrame(animate);
                }
            }

            function calculateKineticEnergy(mass, r, angularSpeed) {
                let I = 0.5*mass*r*r;
                return 0.5*I*angularSpeed*angularSpeed;
            }

            function startSimulation() {
                cancelAnimationFrame(animationId);
                mass = parseFloat(massInput.value);
                angularSpeed = parseFloat(speedInput.value);
                angle = -3 * Math.PI / 2; // Start at -270 degrees
                isSpinning = true;
                collisionInfo.textContent = '';
                animate();
            }

            startBtn.addEventListener('click', startSimulation);
            startSimulation();
        })();
    </script>
</body>
</html>
